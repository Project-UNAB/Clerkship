  /api/cursos/{course_id}/bloques/{block_id}/contenido/{item_id}/entregas:
    post:
      tags:
      - Cursos
      summary: El estudiante entrega los archivos de una tarea, o reemplaza su entrega (versión nueva; las anteriores quedan de historial)
      description: >-
        Se valida contra las reglas de la tarea, en este orden: ventana de tiempo (reloj del servidor),
        cantidad de archivos, tamaño, extensión permitida y contenido real (magic bytes). Si un archivo
        no cumple no se guarda ninguno. Los errores traen `code` (NOT_OPEN, CLOSED, LATE_CLOSED, NO_FILES,
        TOO_MANY_FILES, FILE_TOO_LARGE, TOTAL_TOO_LARGE, EXTENSION_NOT_ALLOWED, DANGEROUS_EXTENSION,
        CONTENT_MISMATCH, EMPTY_FILE, INVALID_BASE64) y las `reglas` vigentes.
      operationId: entregarTarea
      security:
      - BearerAuth: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: block_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: item_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: '`files` con uno o varios archivos, o `name` + `file_base64` para uno solo.'
              properties:
                files:
                  type: array
                  items:
                    type: object
                    required: [name, file_base64]
                    properties:
                      name: {type: string, description: Nombre con extensión}
                      file_base64: {type: string}
                name: {type: string}
                mime_type: {type: string, description: Se ignora — el tipo sale del contenido real}
                file_base64: {type: string}
      responses:
        '201':
          description: Entrega guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntregaTarea'
        '400':
          description: Fuera de la ventana de entrega (NOT_OPEN, CLOSED, LATE_CLOSED), sin archivos o más archivos que max_files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntrega'
        '415':
          description: Extensión no permitida en esta tarea, extensión de la lista negra, o contenido real que no corresponde a la extensión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntrega'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No encontrado
        '413':
          description: Un archivo supera max_file_size_mb, o la entrega completa supera el total permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntrega'
        '503':
          description: Almacenamiento no configurado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    get:
      tags:
      - Cursos
      summary: El docente dueño lista todas las entregas de una tarea para calificarlas
      operationId: listarEntregasTarea
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
