  /api/cursos/{course_id}/bloques/{block_id}/contenido/{item_id}/intentos/{attempt_id}/responder:
    post:
      tags:
      - Cursos
      summary: El estudiante entrega sus respuestas — se califica automáticamente (todo o nada por pregunta)
      operationId: responderIntentoQuiz
      security:
      - BearerAuth: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: block_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: item_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: attempt_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [question_id]
                    properties:
                      question_id: {type: string, format: uuid}
                      selected_choice_ids:
                        type: array
                        items: {type: string, format: uuid}
      responses:
        '200':
          description: >-
            Intento calificado y finalizado. Con `vencido: true` el envío llegó fuera de tiempo
            (límite + QUIZ_GRACE_SECONDS) y solo se calificó lo que estaba guardado (QUIZ_LATE_POLICY=GRADE_SAVED).
        '400':
          description: selected_choice_ids inválido
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No encontrado
        '409':
          description: >-
            El intento ya estaba finalizado (no se puede volver a enviar ni modificar), o el envío llegó
            fuera de tiempo con QUIZ_LATE_POLICY=REJECT (el intento queda cerrado en cero).
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/cursos/{course_id}/bloques/{block_id}/contenido/{item_id}/intentos/{attempt_id}/respuestas:
    put:
      tags:
      - Cursos
      summary: El estudiante guarda el avance de un intento en curso, sin entregarlo ni calificarlo
      description: >-
        Lo guardado es lo que se califica si el tiempo se agota antes de entregar. Reemplaza las
        respuestas de las preguntas enviadas; las demás quedan como estaban.
      operationId: guardarRespuestasIntentoQuiz
      security:
      - BearerAuth: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: block_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: item_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: attempt_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [question_id]
                    properties:
                      question_id: {type: string, format: uuid}
                      selected_choice_ids:
                        type: array
                        items: {type: string, format: uuid}
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  deadline_at: {type: string, format: date-time, nullable: true}
                  segundos_restantes: {type: integer, nullable: true}
        '400':
          description: selected_choice_ids inválido
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No encontrado
        '409':
          description: El intento ya fue entregado o se le agotó el tiempo
        '401':
          $ref: '#/components/responses/UnauthorizedError'
