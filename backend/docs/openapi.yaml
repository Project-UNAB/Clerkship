      description: >-
        Avisa a los estudiantes que no han entregado una tarea que cierra en menos de 24 h. Pensado
        para correr cada hora; cada estudiante recibe el aviso una sola vez por tarea. No usa sesión:
        exige la cabecera `X-Cron-Secret` igual a la variable CRON_SECRET del servidor. Sin esa
        variable configurada, o con un secreto distinto, responde 404.
      operationId: dispararRecordatorios
      security: []
      parameters:
      - {name: X-Cron-Secret, in: header, required: true, schema: {type: string}}
      responses:
        '200':
          description: Resumen de lo enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  tareas: {type: integer}
                  notificaciones: {type: integer}
        '404':
          description: Secreto ausente o incorrecto, o la función no está configurada
