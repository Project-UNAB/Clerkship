          description: Correcto
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Paginacion'
                - type: object
                  properties:
                    no_leidas: {type: integer}
                    notificaciones:
                      type: array
                      items:
                        $ref: '#/components/schemas/Notificacion'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
