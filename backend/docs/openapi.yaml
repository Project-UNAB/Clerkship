        anamnesis:
          type: number
          format: float
          example: 92.0
        diagnostic_tests:
          type: number
          format: float
          example: 85.0
        differential_hypotheses:
          type: number
          format: float
          example: 80.0
        final_diagnosis:
          type: number
          format: float
          example: 95.0
    EvaluateSessionRequest:
      type: object
      required:
      - final_diagnosis
      properties:
        consultation_id:
          type: string
          nullable: true
          example: 33333333-3333-3333-3333-333333333333
        case_id:
          type: string
          nullable: true
          example: CASE-GI-001
        chat_history:
          type: array
          items:
            type: object
        requested_tests:
          type: array
          items:
            type: string
          example:
          - Lipasa sérica
          - Ecografía hepatobiliar
        differential_diagnoses:
          type: array
          items:
            type: string
          example:
          - Colecistitis aguda
          - Úlcera péptica
        final_diagnosis:
          type: string
          example: Pancreatitis aguda de origen biliar
    EvaluationResultResponse:
      type: object
      required:
