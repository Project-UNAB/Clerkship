      - Cursos
      summary: Agrega contenido a un bloque — documento (base64), video (enlace externo), enlace o nota de texto (solo el docente dueño)
      operationId: crearContenidoBloque
      security:
      - BearerAuth: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: block_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title]
              properties:
                type: {type: string, enum: [DOCUMENT, VIDEO, LINK, TEXT, ASSIGNMENT, QUIZ]}
                title: {type: string}
                description: {type: string}
                name: {type: string}
                mime_type: {type: string}
                file_base64: {type: string}
                video_url: {type: string}
                link_url: {type: string}
                text_content: {type: string}
                open_at: {type: string, format: date-time, description: ASSIGNMENT y QUIZ}
                due_at: {type: string, format: date-time, description: ASSIGNMENT y QUIZ}
                max_score: {type: number, description: Solo ASSIGNMENT}
                allow_late: {type: boolean, description: Solo ASSIGNMENT — aceptar entregas después de due_at (quedan marcadas is_late)}
                late_until: {type: string, format: date-time, description: Solo ASSIGNMENT — hasta cuándo se aceptan tardías (vacío = sin tope). Requiere allow_late y due_at}
                allowed_extensions:
                  type: array
                  items: {type: string}
                  example: [pdf, docx, zip, png]
                  description: >-
                    Solo ASSIGNMENT — extensiones que acepta la tarea. Vacío = las del servidor por defecto.
                    Las de la lista negra (exe, bat, sh, js, php, html, svg...) nunca se pueden habilitar.
                max_file_size_mb: {type: integer, minimum: 1, description: Solo ASSIGNMENT — tamaño máximo por archivo (hasta ASSIGNMENT_MAX_FILE_MB)}
                max_files: {type: integer, minimum: 1, default: 1, description: Solo ASSIGNMENT — archivos por entrega (hasta ASSIGNMENT_MAX_FILES)}
                rubric:
                  type: array
                  description: Solo ASSIGNMENT — rúbrica opcional. Con ella max_score pasa a ser la suma de los puntos de los criterios.
                  items:
                    $ref: '#/components/schemas/CriterioRubrica'
                time_limit_minutes: {type: integer, minimum: 1, description: Solo QUIZ — duración máxima del intento}
                max_attempts: {type: integer, minimum: 1, description: Solo QUIZ — vacío = sin límite}
                grade_policy:
                  type: string
                  enum: [BEST, LAST, AVERAGE, FIRST]
                  default: BEST
                  description: Solo QUIZ — qué nota queda cuando hay varios intentos entregados
      responses:
        '201':
          description: Creado
        '400':
          description: Petición inválida
        '415':
          description: Tipo de archivo no permitido, o el contenido real no corresponde a la extensión (se valida por magic bytes)
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No encontrado
        '413':
          description: Archivo demasiado pesado
        '503':
          description: Almacenamiento no configurado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
