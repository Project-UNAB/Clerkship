                $ref: '#/components/schemas/EvaluationResultResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Página (desde 1). Valores inválidos vuelven a 1.
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      required: false
      description: Filas por página. Por defecto 20; nunca más de 100 aunque se pida más.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token de acceso JWT obtenido al iniciar sesión (`/api/auth/login`)
        o registrarse.

        Debe enviarse en la cabecera: `Authorization: Bearer <token>`.

        '
  responses:
    BadRequestError:
      description: Solicitud inválida o datos faltantes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Bad Request
            message: Parámetros obligatorios faltantes
            status_code: 400
    UnauthorizedError:
      description: Token de autenticación ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
            message: Token ausente o expirado
            status_code: 401
    ForbiddenError:
      description: El usuario no posee los permisos o rol requerido para esta acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Forbidden
            message: No tienes permisos para esta acción
            status_code: 403
    NotFoundError:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Not Found
            message: El recurso solicitado no fue encontrado.
            status_code: 404
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      - message
      - status_code
      properties:
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: El recurso solicitado no fue encontrado.
        status_code:
          type: integer
          example: 404
    HealthResponse:
      type: object
      properties:
        status:
