openapi: 3.0.3
info:
  title: Clerkship API - ClinicAI UNAB
  description: '**API REST de la plataforma clínica Clerkship / ClinicAI UNAB** para
    el entrenamiento y evaluación

    del proceso de razonamiento diagnóstico en estudiantes de medicina y ciencias
    de la salud.


    El backend combina:

    * **PostgreSQL** para la persistencia relacional transaccional (usuarios, cursos,
    artículos, carpetas y evaluaciones).

    * **MongoDB** para almacenamiento documental semiestructurado (transcripción de
    chats clínicos, notas de voz y documentos en base64).

    * **JWT (JSON Web Tokens)** con control de acceso basado en roles (`STUDENT`,
    `TEACHER`, `ADMIN`).

    '
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo Clerkship
    url: https://github.com/Steven08Ar/Clerkship
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: http://localhost:5000
  description: Servidor local de desarrollo Flask
tags:
- name: Sistema / Salud
  description: Endpoints de diagnóstico y comprobación de salud del backend
- name: Autenticación
  description: Registro, verificación de correo, inicio de sesión, renovación de tokens
    y gestión de credenciales
- name: Usuarios
  description: Búsqueda, perfiles públicos y actualización de datos personales
- name: Cursos
  description: Gestión académica de asignaturas, matrícula de estudiantes y listado
    de cursos dictados
- name: Biblioteca Médica
  description: Repositorio de literatura científica, categorización por especialidad
    y estante de lectura personal
- name: Documentos y Carpetas
  description: Gestión de carpetas personalizadas y almacenamiento seguro de archivos
    clínicos
- name: Comunidad
  description: Espacio académico de discusión estudiantil, publicaciones, comentarios
    y valoraciones
- name: Simulación Clínica
  description: Ciclo de vida de consultas médicas simuladas, interacción con paciente
    virtual y cierre de casos
- name: Historial y Evaluación
  description: Trazabilidad del razonamiento clínico, retroalimentación formativa
    generada por IA y métricas
- name: Correo y Notificaciones
  description: Servicios de notificación y comprobación del proveedor de mensajería
    (Mailgun)
- name: Agentes de IA
  description: Endpoints mock y servicios para los 3 agentes cognitivos (Generador de Casos, Paciente Virtual y Tutor Evaluador)
paths:
  /api/health:
    get:
      tags:
      - Sistema / Salud
      summary: Comprobación de salud del sistema
      description: Retorna el estado del servicio Flask y la conectividad en vivo
        con PostgreSQL y MongoDB.
      operationId: healthCheck
      responses:
        '200':
          description: Estado del servicio evaluado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/register:
    post:
      tags:
      - Autenticación
      summary: Registro de nuevo usuario
      description: Registra un usuario (STUDENT o TEACHER), envía código de verificación
        de 6 dígitos por correo.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente. Requiere verificación de correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: El correo electrónico ya se encuentra registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/verify-email:
    post:
      tags:
      - Autenticación
      summary: Verificar correo con código de 6 dígitos
      description: Valida el código de un solo uso para activar la cuenta del usuario.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Correo verificado exitosamente. Emite tokens de sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /api/auth/resend-code:
    post:
      tags:
      - Autenticación
      summary: Reenviar código de verificación
      description: Genera y reenvía un nuevo código de 6 dígitos con periodo de enfriamiento.
      operationId: resendCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: estudiante@unab.edu.co
      responses:
        '200':
          description: Código reenviado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Código de verificación reenviado
        '400':
          $ref: '#/components/responses/BadRequestError'
  /api/auth/forgot-password:
    post:
      tags:
      - Autenticación
      summary: Solicitar código para recuperar la contraseña
      description: Envía un código de 6 dígitos al correo si la cuenta existe y está verificada. La respuesta es siempre la misma (no revela si el correo tiene cuenta).
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: estudiante@unab.edu.co
      responses:
        '200':
          description: Respuesta genérica (siempre igual)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  ok:
                    type: boolean
        '503':
          description: El servicio de correo no está disponible en este momento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/reset-password:
    post:
      tags:
      - Autenticación
      summary: Cambiar la contraseña con el código recibido por correo
      description: Valida el código de 6 dígitos (vence en 10 minutos, máximo 5 intentos) y guarda la nueva contraseña.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              - new_password
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  ok:
                    type: boolean
        '400':
          description: Código inválido o vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: Autentica al usuario mediante email y contraseña, retornando access
        y refresh tokens JWT.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/refresh:
    post:
      tags:
      - Autenticación
      summary: Renovar access token
      description: Emite un nuevo token de acceso a partir de un refresh token JWT
        válido.
      operationId: refreshToken
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Token renovado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6...
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/me:
    get:
      tags:
      - Autenticación
      summary: Obtener usuario autenticado
      description: Retorna el perfil y los datos del usuario correspondiente al token
        JWT provisto.
      operationId: getCurrentUser
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Perfil del usuario obtenido con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/change-password:
    post:
      tags:
      - Autenticación
      summary: Cambiar contraseña
      description: Actualiza la contraseña del usuario verificando la contraseña actual.
      operationId: changePassword
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña cambiada correctamente
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/avatar:
    post:
      tags:
      - Autenticación
      summary: Actualizar avatar generado
      description: Guarda la configuración del avatar SVG de DiceBear para el usuario.
      operationId: updateAvatar
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - avatar_svg
              properties:
                avatar_svg:
                  type: string
                  description: Contenido SVG o URL de DiceBear
      responses:
        '200':
          description: Avatar actualizado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/usuarios/buscar:
    get:
      tags:
      - Usuarios
      summary: Búsqueda de usuarios
      description: Busca usuarios por prefijo de username (@usuario) o nombre completo.
      operationId: searchUsers
      security:
      - BearerAuth: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Término de búsqueda
      responses:
        '200':
          description: Lista de usuarios coincidentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
  /api/usuarios/{id}:
    get:
      tags:
      - Usuarios
      summary: Perfil público de un usuario
      description: Retorna la información pública de un usuario por su UUID.
      operationId: getUserById
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Información pública del usuario obtenida con éxito
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/usuarios/me:
    patch:
      tags:
      - Usuarios
      summary: Actualizar perfil propio
      description: Modifica nombre, apellido o datos del perfil del usuario autenticado.
      operationId: updateMyProfile
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: Camilo
                last_name:
                  type: string
                  example: Vega
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/usuarios/uso-almacenamiento:
    get:
      tags:
      - Usuarios
      summary: Consultar métricas de almacenamiento de usuario
      description: Retorna el uso de almacenamiento en bytes para documentos y límites establecidos.
      operationId: getStorageUsage
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Estadísticas de almacenamiento obtenidas con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  used_bytes:
                    type: integer
                    example: 1048576
                  limit_bytes:
                    type: integer
                    example: 5368709120
                  breakdown:
                    type: object
                    properties:
                      documentos:
                        type: integer
                        example: 1048576
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/cursos:
    get:
      tags:
      - Cursos
      summary: Listar todos los cursos
      description: Catálogo general de asignaturas y rotaciones médicas.
      operationId: listCourses
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseResponse'
          description: Lista de cursos obtenida con éxito
    post:
      tags:
      - Cursos
      summary: Crear un nuevo curso
      description: Rol requerido TEACHER. Crea una nueva asignatura en el sistema.
      operationId: createCourse
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Curso creado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/cursos/mios:
    get:
      tags:
      - Cursos
      summary: Cursos del usuario autenticado
      description: Si el rol es STUDENT retorna los matriculados; si es TEACHER retorna
        los dictados.
      operationId: getMyCourses
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseResponse'
          description: Cursos del usuario obtenidos con éxito
  /api/cursos/{id}:
    get:
      tags:
      - Cursos
      summary: Detalle de un curso
      operationId: getCourseById
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
          description: Detalle del curso obtenido con éxito
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/cursos/{id}/matricular:
    post:
      tags:
      - Cursos
      summary: Matricular estudiante en curso
      description: Rol requerido STUDENT. Inscribe al estudiante en la asignatura.
      operationId: enrollCourse
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Matrícula exitosa
        '403':
          $ref: '#/components/responses/ForbiddenError'
    delete:
      tags:
      - Cursos
      summary: Cancelar matrícula de curso
      description: Rol requerido STUDENT. Retira al estudiante del curso.
      operationId: unenrollCourse
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Desmatriculación exitosa
  /api/articulos:
    get:
      tags:
      - Biblioteca Médica
      summary: Buscar y listar artículos médicos
      description: Permite filtrar por especialidad, etiqueta (tag) o texto de búsqueda.
      operationId: listArticles
      security:
      - BearerAuth: []
      parameters:
      - name: specialty
        in: query
        schema:
          type: string
        example: Gastroenterología
      - name: tag
        in: query
        schema:
          type: string
        example: GUÍA
      - name: q
        in: query
        schema:
          type: string
        description: Texto en título o contenido
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleResponse'
          description: Artículos médicos encontrados con éxito
    post:
      tags:
      - Biblioteca Médica
      summary: Publicar artículo médico
      description: Rol requerido TEACHER. Sube un nuevo artículo a la biblioteca.
      operationId: createArticle
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArticleRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
          description: Artículo publicado con éxito
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/articulos/{id}:
    get:
      tags:
      - Biblioteca Médica
      summary: Detalle de un artículo médico
      operationId: getArticleById
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
          description: Detalle del artículo médico obtenido con éxito
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/articulos/estante:
    get:
      tags:
      - Biblioteca Médica
      summary: Estante de lectura personal
      description: Rol requerido STUDENT. Artículos guardados por el estudiante con
        estado (NEXT, FINISHED).
      operationId: getStudentShelf
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentShelfItem'
          description: Estante de lectura personal obtenido con éxito
  /api/articulos/{id}/estante:
    post:
      tags:
      - Biblioteca Médica
      summary: Guardar artículo en el estante
      description: Rol requerido STUDENT. Guarda o actualiza el estado de lectura
        (NEXT o FINISHED).
      operationId: saveToShelf
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - NEXT
                  - FINISHED
                  example: NEXT
      responses:
        '200':
          description: Artículo guardado en el estante
    delete:
      tags:
      - Biblioteca Médica
      summary: Quitar artículo del estante
      description: Rol requerido STUDENT.
      operationId: removeFromShelf
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Artículo removido del estante
  /api/documentos/carpetas:
    get:
      tags:
      - Documentos y Carpetas
      summary: Listar carpetas de documentos
      description: Retorna las carpetas creadas por el usuario con conteo de archivos.
      operationId: listFolders
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentFolderResponse'
          description: Carpetas del usuario obtenidas con éxito
    post:
      tags:
      - Documentos y Carpetas
      summary: Crear carpeta
      operationId: createFolder
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFolderResponse'
          description: Carpeta creada exitosamente
  /api/documentos/carpetas/{id}:
    patch:
      tags:
      - Documentos y Carpetas
      summary: Editar carpeta (nombre o color)
      operationId: updateFolder
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Casos Rotación 2026
                color:
                  type: string
                  example: '#3B82F6'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFolderResponse'
          description: Carpeta actualizada exitosamente
    delete:
      tags:
      - Documentos y Carpetas
      summary: Eliminar carpeta
      operationId: deleteFolder
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Carpeta eliminada
  /api/documentos/archivos:
    get:
      tags:
      - Documentos y Carpetas
      summary: Listar archivos
      description: Filtra por folder_id o muestra los documentos recientes del usuario.
      operationId: listDocuments
      security:
      - BearerAuth: []
      parameters:
      - name: folder_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentFileResponse'
          description: Documentos obtenidos con éxito
    post:
      tags:
      - Documentos y Carpetas
      summary: Subir documento
      description: Almacena metadatos en PostgreSQL y contenido base64 en MongoDB.
      operationId: uploadDocument
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFileResponse'
          description: Documento subido y procesado exitosamente
  /api/documentos/archivos/{id}:
    get:
      tags:
      - Documentos y Carpetas
      summary: Descargar o ver archivo
      operationId: getDocumentById
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFileResponse'
          description: Contenido y metadatos del documento obtenidos con éxito
    delete:
      tags:
      - Documentos y Carpetas
      summary: Eliminar archivo
      operationId: deleteDocument
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Archivo eliminado
  /api/comunidad/posts:
    get:
      tags:
      - Comunidad
      summary: Listar publicaciones de la comunidad
      operationId: listCommunityPosts
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
