openapi: 3.0.3
info:
  title: Clerkship API - ClinicAI UNAB
  description: '**API REST de la plataforma clínica Clerkship / ClinicAI UNAB** para
    el entrenamiento y evaluación

    del proceso de razonamiento diagnóstico en estudiantes de medicina y ciencias
    de la salud.


    El backend combina:

    * **PostgreSQL** para la persistencia relacional transaccional (usuarios, cursos,
    artículos, carpetas y evaluaciones).

    * **MongoDB** para almacenamiento documental semiestructurado (transcripción de
    chats clínicos, notas de voz y documentos en base64).

    * **JWT (JSON Web Tokens)** con control de acceso basado en roles (`STUDENT`,
    `TEACHER`, `ADMIN`).

    '
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo Clerkship
    url: https://github.com/Steven08Ar/Clerkship
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: http://localhost:5000
  description: Servidor local de desarrollo Flask
tags:
- name: Sistema / Salud
  description: Endpoints de diagnóstico y comprobación de salud del backend
- name: Autenticación
  description: Registro, verificación de correo, inicio de sesión, renovación de tokens
    y gestión de credenciales
- name: Usuarios
  description: Búsqueda, perfiles públicos y actualización de datos personales
- name: Cursos
  description: Gestión académica de asignaturas, matrícula de estudiantes y listado
    de cursos dictados
- name: Biblioteca Médica
  description: Repositorio de literatura científica, categorización por especialidad
    y estante de lectura personal
- name: Documentos y Carpetas
  description: Gestión de carpetas personalizadas y almacenamiento seguro de archivos
    clínicos
- name: Comunidad
  description: Espacio académico de discusión estudiantil, publicaciones, comentarios
    y valoraciones
- name: Simulación Clínica
  description: Ciclo de vida de consultas médicas simuladas, interacción con paciente
    virtual y cierre de casos
- name: Historial y Evaluación
  description: Trazabilidad del razonamiento clínico, retroalimentación formativa
    generada por IA y métricas
- name: Correo y Notificaciones
  description: Servicios de notificación y comprobación del proveedor de mensajería
    (Mailgun)
- name: Agentes de IA
  description: Endpoints mock y servicios para los 3 agentes cognitivos (Generador de Casos, Paciente Virtual y Tutor Evaluador)
paths:
  /api/health:
    get:
      tags:
      - Sistema / Salud
      summary: Comprobación de salud del sistema
      description: Retorna el estado del servicio Flask y la conectividad en vivo
        con PostgreSQL y MongoDB.
      operationId: healthCheck
      responses:
        '200':
          description: Estado del servicio evaluado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/register:
    post:
      tags:
      - Autenticación
      summary: Registro de nuevo usuario
      description: Registra un usuario (STUDENT o TEACHER), envía código de verificación
        de 6 dígitos por correo.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente. Requiere verificación de correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: El correo electrónico ya se encuentra registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/verify-email:
    post:
      tags:
      - Autenticación
      summary: Verificar correo con código de 6 dígitos
      description: Valida el código de un solo uso para activar la cuenta del usuario.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Correo verificado exitosamente. Emite tokens de sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /api/auth/resend-code:
    post:
      tags:
      - Autenticación
      summary: Reenviar código de verificación
      description: Genera y reenvía un nuevo código de 6 dígitos con periodo de enfriamiento.
      operationId: resendCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: estudiante@unab.edu.co
      responses:
        '200':
          description: Código reenviado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Código de verificación reenviado
        '400':
          $ref: '#/components/responses/BadRequestError'
  /api/auth/forgot-password:
    post:
      tags:
      - Autenticación
      summary: Solicitar código para recuperar la contraseña
      description: Envía un código de 6 dígitos al correo si la cuenta existe y está verificada. La respuesta es siempre la misma (no revela si el correo tiene cuenta).
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: estudiante@unab.edu.co
      responses:
        '200':
          description: Respuesta genérica (siempre igual)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  ok:
                    type: boolean
        '503':
          description: El servicio de correo no está disponible en este momento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/reset-password:
    post:
      tags:
      - Autenticación
      summary: Cambiar la contraseña con el código recibido por correo
      description: Valida el código de 6 dígitos (vence en 10 minutos, máximo 5 intentos) y guarda la nueva contraseña.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              - new_password
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  ok:
                    type: boolean
        '400':
          description: Código inválido o vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: Autentica al usuario mediante email y contraseña, retornando access
        y refresh tokens JWT.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/refresh:
    post:
      tags:
      - Autenticación
      summary: Renovar access token
      description: Emite un nuevo token de acceso a partir de un refresh token JWT
        válido.
      operationId: refreshToken
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Token renovado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6...
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/logout:
    post:
      tags:
      - Autenticación
      summary: Cerrar sesión — revoca el access token de la petición y, si se envía, el refresh token
      description: >-
        El access token queda en la lista de revocación y deja de servir de inmediato (401 en cualquier
        ruta). Enviar `refresh_token` en el cuerpo lo revoca también, para que no se pueda pedir otro
        access token con él. Solo se revoca un refresh token del mismo usuario.
      operationId: logout
      security:
      - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/logout-all:
    post:
      tags:
      - Autenticación
      summary: Cerrar la sesión en todos los dispositivos
      description: Ningún token emitido hasta ese momento (access o refresh) vuelve a servir.
      operationId: logoutAll
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Se cerraron todas las sesiones
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/me:
    get:
      tags:
      - Autenticación
      summary: Obtener usuario autenticado
      description: Retorna el perfil y los datos del usuario correspondiente al token
        JWT provisto.
      operationId: getCurrentUser
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Perfil del usuario obtenido con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/change-password:
    post:
      tags:
      - Autenticación
      summary: Cambiar contraseña
      description: Actualiza la contraseña del usuario verificando la contraseña actual.
      operationId: changePassword
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña cambiada correctamente
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/avatar:
    post:
      tags:
      - Autenticación
      summary: Actualizar avatar generado
      description: Guarda la configuración del avatar SVG de DiceBear para el usuario.
      operationId: updateAvatar
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - avatar_svg
              properties:
                avatar_svg:
                  type: string
                  description: Contenido SVG o URL de DiceBear
      responses:
        '200':
          description: Avatar actualizado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/usuarios/buscar:
    get:
      tags:
      - Usuarios
      summary: Búsqueda de usuarios
      description: Busca usuarios por prefijo de username (@usuario) o nombre completo.
      operationId: searchUsers
      security:
      - BearerAuth: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Término de búsqueda
      responses:
        '200':
          description: Lista de usuarios coincidentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
  /api/usuarios/{id}:
    get:
      tags:
      - Usuarios
      summary: Perfil público de un usuario
      description: Retorna la información pública de un usuario por su UUID.
      operationId: getUserById
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Información pública del usuario obtenida con éxito
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/usuarios/me:
    patch:
      tags:
      - Usuarios
      summary: Actualizar perfil propio
      description: Modifica nombre, apellido o datos del perfil del usuario autenticado.
      operationId: updateMyProfile
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: Camilo
                last_name:
                  type: string
                  example: Vega
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/usuarios/uso-almacenamiento:
    get:
      tags:
      - Usuarios
      summary: Consultar métricas de almacenamiento de usuario
      description: Retorna el uso de almacenamiento en bytes para documentos y límites establecidos.
      operationId: getStorageUsage
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Estadísticas de almacenamiento obtenidas con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  used_bytes:
                    type: integer
                    example: 1048576
                  limit_bytes:
                    type: integer
                    example: 5368709120
                  breakdown:
                    type: object
                    properties:
                      documentos:
                        type: integer
                        example: 1048576
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/cursos:
    get:
      tags:
      - Cursos
      summary: Listar todos los cursos
      description: Catálogo general de asignaturas y rotaciones médicas.
      operationId: listCourses
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseResponse'
          description: Lista de cursos obtenida con éxito
    post:
      tags:
      - Cursos
      summary: Crear un nuevo curso
      description: >-
        Rol requerido TEACHER. Crea una nueva asignatura en el sistema. Acepta JSON, o
        multipart/form-data con los mismos campos y la imagen de portada en `cover`.
      operationId: createCourse
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CursoConPortada'
      responses:
        '201':
          description: Curso creado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          description: Datos inválidos, o imagen con dimensiones fuera de rango (COVER_TOO_SMALL, COVER_DIMENSIONS)
        '413':
          description: La imagen de portada pesa más de 2 MB (COVER_TOO_LARGE)
        '415':
          description: La portada no es JPG/PNG/WebP (COVER_FORMAT) o su contenido real no es una imagen (COVER_NOT_AN_IMAGE)
        '503':
          description: El almacenamiento no está configurado
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/cursos/mis-fechas:
    get:
      tags:
      - Cursos
      summary: Entregas y evaluaciones con fecha límite del usuario
      description: Retorna todas las Tareas (ASSIGNMENT) y Cuestionarios (QUIZ) con
        due_at de los cursos del usuario. Estudiante → sus matrículas. Docente →
        sus cursos propios.
      operationId: getMisFechas
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Lista de fechas obtenida
          content:
            application/json:
              schema:
                type: object
                properties:
                  fechas:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          format: uuid
                        course_id:
                          type: string
                          format: uuid
                        course_name:
                          type: string
                        title:
                          type: string
                        type:
                          type: string
                          enum: [ASSIGNMENT, QUIZ]
                        due_at:
                          type: string
                          format: date-time
                          nullable: true
                        open_at:
                          type: string
                          format: date-time
                          nullable: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/cursos/mios:
    get:
      tags:
      - Cursos
      summary: Cursos del usuario autenticado
      description: Si el rol es STUDENT retorna los matriculados; si es TEACHER retorna
        los dictados.
      operationId: getMyCourses
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  description: Sin page ni per_page — forma anterior, limitada a 100 cursos
                  items:
                    $ref: '#/components/schemas/CourseResponse'
                - allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    description: Con page o per_page
                    properties:
                      cursos:
                        type: array
                        items:
                          $ref: '#/components/schemas/CourseResponse'
          description: >-
            Cursos del usuario (los que están en la papelera no aparecen). Con page o per_page responde
            {cursos, total, page, per_page, pages}; sin ellos, un arreglo de hasta 100 cursos.
  /api/cursos/{id}:
    patch:
      tags:
      - Cursos
      summary: Edita nombre, descripción (HTML), período o portada de un curso propio (solo el docente dueño)
      description: >-
        Acepta JSON, o multipart/form-data con los mismos campos y la imagen de portada en `cover`.
        Al reemplazar la portada, la anterior (y su miniatura) se borra de R2.
      operationId: actualizarCurso
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                description: {type: string}
                academic_period: {type: string}
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CursoConPortada'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          description: Datos inválidos, o imagen con dimensiones fuera de rango (COVER_TOO_SMALL, COVER_DIMENSIONS)
        '413':
          description: La imagen de portada pesa más de 2 MB (COVER_TOO_LARGE)
        '415':
          description: La portada no es JPG/PNG/WebP (COVER_FORMAT) o su contenido real no es una imagen (COVER_NOT_AN_IMAGE)
        '503':
          description: El almacenamiento no está configurado
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No encontrado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags:
      - Cursos
      summary: Manda un curso propio a la papelera (borrado suave, se puede restaurar)
      description: >-
        El curso deja de existir para estudiantes y listados (responde 404 como cualquier id
        desconocido), pero no se borra nada: ni filas ni archivos. Se restaura con POST
        /api/cursos/{id}/restaurar o se borra para siempre con DELETE /api/cursos/{id}/permanente.
      operationId: borrarCurso
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: En la papelera
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  deleted_at: {type: string, format: date-time}
                  restorable: {type: boolean}
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No encontrado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    get:
      tags:
      - Cursos
      summary: Detalle de un curso
      operationId: getCourseById
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
          description: Detalle del curso obtenido con éxito
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/cursos/papelera:
    get:
      tags:
      - Cursos
      summary: Cursos que el docente mandó a la papelera
      operationId: listarPapeleraCursos
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Paginacion'
                - type: object
                  properties:
                    cursos:
                      type: array
                      items:
                        $ref: '#/components/schemas/CourseResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/cursos/{course_id}/restaurar:
    post:
      tags:
      - Cursos
      summary: Saca un curso de la papelera (solo el docente dueño)
      operationId: restaurarCurso
      security:
      - BearerAuth: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Curso restaurado, con sus estudiantes, material, entregas y notas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Ese curso no está en la papelera
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/cursos/{course_id}/permanente:
    delete:
      tags:
      - Cursos
      summary: Borra para siempre un curso que está en la papelera (solo el docente dueño)
      description: >-
        Borra el curso con todo lo que cuelga de él (bloques, contenido, entregas, intentos, preguntas,
        avisos y matrículas, por ON DELETE CASCADE). Bloqueado si el curso tiene simulaciones clínicas.
        Los archivos en R2 (material, entregas, portada) se anotan como pendientes en la misma
        transacción y se borran después del commit; lo que R2 no deje borrar queda en cola y se reintenta.
      operationId: borrarCursoDefinitivamente
      security:
      - BearerAuth: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Borrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  files_deleted: {type: integer, description: Archivos ya borrados de R2}
                  files_pending: {type: integer, description: Archivos que quedaron en cola para reintentar}
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Ese curso no está en la papelera (un curso vigente primero se manda a la papelera)
        '409':
          description: El curso tiene simulaciones clínicas de estudiantes
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/cursos/{id}/matricular:
    post:
      tags:
      - Cursos
      summary: Matricular estudiante en curso
      description: >-
        Rol requerido STUDENT. El resultado depende del `enrollment_mode` del curso:
        OPEN matricula directo; CODE exige el código del curso en `code` (403 con el
        mismo mensaje si falta, es incorrecto o el docente lo desactivó); APPROVAL no
        matricula, deja una solicitud pendiente (202) que resuelve el docente.
        Limitado a 10 intentos por minuto.
      operationId: enrollCourse
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatricularRequest'
      responses:
        '201':
          description: Matrícula registrada (modo OPEN, o CODE con el código correcto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatriculaResultado'
        '202':
          description: Solicitud de matrícula pendiente de aprobación del docente (modo APPROVAL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatriculaResultado'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: El estudiante ya está matriculado en el curso
        '429':
          description: Demasiados intentos de matrícula; espera un minuto
    delete:
      tags:
      - Cursos
      summary: Cancelar matrícula de curso
      description: Rol requerido STUDENT. Retira al estudiante del curso.
      operationId: unenrollCourse
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Desmatriculación exitosa
