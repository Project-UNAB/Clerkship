      description: >-
        Tipos: ASSIGNMENT_PUBLISHED (nueva tarea), ANNOUNCEMENT (nuevo aviso), ASSIGNMENT_GRADED
        (tarea calificada) y DUE_SOON (la tarea cierra en menos de 24 h y no se ha entregado).
        `event_at` es una fecha en UTC (p. ej. el cierre) que la interfaz muestra en la zona horaria
        del usuario.
      operationId: listarNotificaciones
